    {"Name":"data-protection-policy","Version":"2021-06-01","Statement":[{"Sid":"deny-inbound-email","DataDirection":"Inbound","Principal":["*"],"DataIdentifier":["arn:aws:dataprotection::aws:data-identifier/EmailAddress"],"Operation":{"Deny":{}}}]}
  tags:
    - key: tag1
      value: val1
